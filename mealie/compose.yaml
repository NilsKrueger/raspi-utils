services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v2.4.2
    container_name: mealie
    restart: always
    ports:
       - "9925:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - "/root/mealie-data:/app/data/"
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      MAX_WORKERS: 1
      WEB_CONCURRENCY: 1
      BASE_URL: https://mealie.slin.lol
